name: CI

# A broken post (bad front matter, unknown project) fails here, on the pull
# request, instead of on main where it would stop the deploy.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Type-check and build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: homepage:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container
        run: |
          docker run -d --name site -p 3000:3000 homepage:ci
          for i in $(seq 1 10); do curl -fs http://localhost:3000/ >/dev/null && break; sleep 1; done
          curl -fs http://localhost:3000/ | grep -q 'dennis'
          curl -fs http://localhost:3000/rss.xml | grep -q '<rss'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/does-not-exist)" = 404
