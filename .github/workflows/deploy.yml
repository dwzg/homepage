name: Build and Deploy to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys racing would leave whichever image finished last, which may not
# be the newest commit.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The default "docker" driver cannot export a build cache.
      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Clean up BEFORE pushing, never after: this deletes untagged package
      # versions, and running it last can race the deploy for the image that
      # was just pushed.
      - name: Delete old untagged package versions
        continue-on-error: true
        uses: minish144/delete-untagged-action@v2
        with:
          github-token: ${{ secrets.DELETE_PACKAGES_TOKEN }}
          personal-account: true

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Tag with the commit as well as latest, so a bad deploy can be
          # rolled back by pinning the previous SHA in the compose file.
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # One plain manifest, not an index. With buildx's container driver a
          # provenance attestation turns the tag into an index whose children
          # are untagged versions, which the cleanup step above then deletes,
          # and every pull fails with "manifest unknown".
          provenance: false
          sbom: false

      # Arcane deploys hosts/vps/homepage from github.com/dwzg/docker-compose: pinning the new
      # tag there is the deployment (live within ~5 minutes). Roll back by reverting that commit.
      - name: Deploy via the homelab repo
        env:
          DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          STACK: homepage
          IMAGE: ghcr.io/dwzg/homepage
          TAG: ${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "::notice::No HOMELAB_DEPLOY_KEY secret, so nothing was deployed"; exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/homelab && chmod 600 ~/.ssh/homelab
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/homelab -o IdentitiesOnly=yes"
          git clone --quiet --depth 1 git@github.com:dwzg/docker-compose.git "$RUNNER_TEMP/homelab"
          cd "$RUNNER_TEMP/homelab"
          file="hosts/vps/$STACK/compose.yaml"
          sed -i -E "s#(image: ${IMAGE}):[^[:space:]]+#\1:${TAG}#" "$file"
          if git diff --quiet; then echo "$file already runs $TAG"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "deploy($STACK): $TAG" -m "Built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase; done
          exit 1
