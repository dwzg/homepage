name: Build and Deploy to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys racing would leave whichever image finished last, which may not
# be the newest commit.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The default "docker" driver cannot export a build cache.
      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Clean up BEFORE pushing, never after: this deletes untagged package
      # versions, and running it last can race the webhook for the image that
      # was just pushed.
      - name: Delete old untagged package versions
        continue-on-error: true
        uses: minish144/delete-untagged-action@v2
        with:
          github-token: ${{ secrets.DELETE_PACKAGES_TOKEN }}
          personal-account: true

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Tag with the commit as well as latest, so a bad deploy can be
          # rolled back by pinning the previous SHA in the compose file.
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # One plain manifest, not an index. With buildx's container driver a
          # provenance attestation turns the tag into an index whose children
          # are untagged versions, which the cleanup step above then deletes,
          # and every pull fails with "manifest unknown".
          provenance: false
          sbom: false

      - name: Trigger Portainer webhook
        uses: distributhor/workflow-webhook@v3
        with:
          webhook_url: ${{ secrets.PORTAINER_WEBHOOK_URL }}
